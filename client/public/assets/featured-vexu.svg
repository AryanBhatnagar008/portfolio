<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1420"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g stroke="#a855f7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- chassis -->
    <rect x="260" y="330" width="280" height="90" rx="10"/>
    <!-- wheels -->
    <circle cx="310" cy="440" r="34"/>
    <circle cx="490" cy="440" r="34"/>
    <circle cx="310" cy="440" r="12"/>
    <circle cx="490" cy="440" r="12"/>
    <!-- conveyor tower -->
    <path d="M300 330 L 380 190 L 520 190"/>
    <path d="M330 330 L 402 205"/>
    <!-- pneumatic cylinder -->
    <line x1="470" y1="330" x2="520 " y2="250"/>
    <rect x="508" y="222" width="44" height="20" rx="8" transform="rotate(-58 530 232)"/>
  </g>
  <!-- conveyor rollers -->
  <g fill="#06b6d4" opacity="0.6">
    <circle cx="392" cy="212" r="8"/>
    <circle cx="428" cy="196" r="8"/>
    <circle cx="466" cy="190" r="8"/>
  </g>
  <text x="400" y="565" text-anchor="middle" font-family="monospace" font-size="20" fill="#9d9daa">VEXU COMPETITION ROBOT — PHOTOS COMING SOON</text>
</svg>
