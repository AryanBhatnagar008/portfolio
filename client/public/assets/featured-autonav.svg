<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a1c"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- waypoint path -->
  <path d="M120 480 C 240 380, 300 470, 400 380 S 620 260, 680 160" stroke="#06b6d4" stroke-width="4" fill="none" stroke-dasharray="12 12" opacity="0.6"/>
  <g fill="#06b6d4" opacity="0.8">
    <circle cx="120" cy="480" r="10"/>
    <circle cx="400" cy="380" r="10"/>
    <circle cx="680" cy="160" r="10"/>
  </g>
  <!-- robot -->
  <g stroke="#a855f7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="330" y="300" width="140" height="110" rx="14"/>
    <!-- treads -->
    <rect x="308" y="310" width="22" height="90" rx="10"/>
    <rect x="470" y="310" width="22" height="90" rx="10"/>
    <!-- ultrasonic sensors -->
    <circle cx="365" cy="290" r="12"/>
    <circle cx="435" cy="290" r="12"/>
    <!-- marker mast -->
    <line x1="400" y1="300" x2="400" y2="240"/>
    <rect x="375" y="210" width="50" height="30" rx="4"/>
  </g>
  <!-- sensor waves -->
  <g stroke="#a855f7" stroke-width="3" fill="none" opacity="0.35">
    <path d="M360 265 a 40 40 0 0 1 80 0"/>
    <path d="M345 250 a 60 60 0 0 1 110 0"/>
  </g>
  <text x="400" y="565" text-anchor="middle" font-family="monospace" font-size="20" fill="#9d9daa">AUTONOMOUS NAV ROBOT — PHOTOS COMING SOON</text>
</svg>
