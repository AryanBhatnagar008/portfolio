<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a14"/>
      <stop offset="1" stop-color="#0a0a0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- phone -->
  <g stroke="#a855f7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <rect x="330" y="60" width="150" height="290" rx="22"/>
    <line x1="380" y1="85" x2="430" y2="85"/>
    <!-- chat bubbles on screen -->
    <rect x="350" y="115" width="80" height="30" rx="10" opacity="0.7"/>
    <rect x="380" y="160" width="80" height="30" rx="10" opacity="0.5"/>
    <rect x="350" y="205" width="95" height="45" rx="10" opacity="0.7"/>
  </g>
  <!-- perfume bottle -->
  <g stroke="#06b6d4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <rect x="540" y="220" width="90" height="120" rx="14"/>
    <rect x="565" y="185" width="40" height="35" rx="6"/>
    <rect x="572" y="160" width="26" height="25" rx="6"/>
  </g>
  <!-- spray sparkles -->
  <g fill="#06b6d4" opacity="0.6">
    <circle cx="650" cy="140" r="5"/>
    <circle cx="675" cy="115" r="4"/>
    <circle cx="700" cy="150" r="6"/>
    <circle cx="668" cy="170" r="3"/>
  </g>
  <!-- AI sparkle near phone -->
  <g stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M265 130 v40 M245 150 h40"/>
    <path d="M285 230 v24 M273 242 h24"/>
  </g>
  <text x="400" y="415" text-anchor="middle" font-family="monospace" font-size="20" fill="#9d9daa">VETIVER — SCREENSHOTS COMING SOON</text>
</svg>
